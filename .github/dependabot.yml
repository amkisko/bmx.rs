version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
