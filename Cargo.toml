[workspace]
resolver = "2"
members = [".", "usr/bin/release"]

[workspace.package]
version = "0.1.4"
edition = "2024"
authors = ["amkisko"]
license = "MIT"
repository = "https://github.com/amkisko/bmx.rs"
homepage = "https://github.com/amkisko/bmx.rs"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
type_complexity = "warn"
too_many_arguments = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "bmx_rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Install, build, and run software from git sources"
keywords = ["cli", "package-manager", "git", "installer"]
categories = ["command-line-utilities", "development-tools"]
autobins = false
default-run = "bmx"

[[bin]]
name = "bmx"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
  "derive",
] }
clap_complete = "4"
clap_mangen = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.5 uses serde only; 0.8+ pulls toml_edit + winnow + indexmap (large lockfile).
toml = "1.1"
ureq = { version = "3.4", default-features = true }
url = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
temp-env = "0.3"
serial_test = "4"
serde_json = "1"
